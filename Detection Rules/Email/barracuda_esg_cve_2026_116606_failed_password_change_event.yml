title: Barracuda ESG Failed Password Change Audit Event - Potential CVE-2026-116606 Exploitation
id: df89c9e8-2820-452e-a14a-2f3431ae0672
status: experimental
description: |
    Detects the failed_password_change audit event in logs forwarded from a Barracuda Email Security Gateway.
    watchTowr reports that the CVE-2026-116606 bypass abuses password-change handling that keeps processing
    a request after the change fails, so an unexplained failed change can mark an exploitation attempt.
    The event name comes from code review; how it appears in exported web syslog is not confirmed.
references:
    - https://labs.watchtowr.com/barracuda-networks-is-your-new-best-friend-barracuda-email-security-gateway-pre-auth-remote-root-rce-cve-2026-116606-cve-2026-111560/
    - https://documentation.campus.barracuda.com/wiki/spaces/BSFv51/pages/6685038/Syslog+and+the+Barracuda+Email+Security+Gateway
    - https://github.com/mandiant/Vulnerability-Disclosures/blob/master/2026/MNDT-2026-0042.md
    - https://netsec101.com/?p=241
author: netsec101.com
date: 2026-11-15
tags:
    - attack.initial-access
    - attack.t1190
    - cve.2026-116606
    - detection.emerging-threats
logsource:
    product: barracuda
    service: esg
    definition: 'Requirements: ESG web interface syslog forwarded to the SIEM (ADVANCED > Advanced Networking). Map this logsource to that index in your pipeline.'
detection:
    keywords:
        - 'failed_password_change'
    condition: keywords
falsepositives:
    - An administrator mistyping the retype-password field during a real password change; confirm with the admin team and check the source IP
level: medium
