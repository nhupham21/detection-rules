title: XVD Miner Staging or Persistence Files Created - N-central 4EverAble2Shell Campaign
id: be2235c4-7763-45ed-8069-29826d11f456
status: test
description: |
    Detects the files written by the jup.sh installer seen after 4EverAble2Shell exploitation: the miner folder
    /tmp/.xvd or /var/tmp/.xvd and its watchdog persistence through /etc/systemd/system/xvd.service or /etc/cron.d/xvd.
references:
    - https://huntback.io/blog/ncentral-4everable2shell-miners-on-live-servers
    - https://netsec101.com/?p=240
author: netsec101.com
date: 2026-11-15
tags:
    - attack.persistence
    - attack.t1543.002
    - attack.t1053.003
    - attack.impact
    - attack.t1496.001
    - detection.emerging-threats
logsource:
    product: linux
    category: file_event
detection:
    selection_staging:
        TargetFilename|startswith:
            - '/tmp/.xvd/'
            - '/var/tmp/.xvd/'
    selection_persistence:
        TargetFilename:
            - '/etc/systemd/system/xvd.service'
            - '/etc/cron.d/xvd'
    condition: 1 of selection_*
falsepositives:
    - Unlikely. Unrelated software using a hidden .xvd folder in /tmp or an xvd systemd unit would match; check owner and content
level: high
