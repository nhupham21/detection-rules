title: TAC Agent C2 Implant Activity Seen After CVE-2026-123158 Exploitation
id: 725fec7b-3138-4c73-a077-bef014f69788
status: test
description: |
    Detects command lines referencing the TAC Agent Python implant, its OpenRC service or its C2 domain, as observed
    by GreyNoise on Alpine hosts compromised through sshole (CVE-2026-123158) in November 2026. Covers the agent run,
    the service install and the /etc/hosts pinning of the C2 domain when run through an SSH exec channel.
references:
    - https://sshole.events.greynoise.io/
    - https://bleepingcomputer.com/news/security/hackers-exploit-sshole-openssh-flaw-to-breach-linux-systems
    - https://netsec101.com/?p=242
author: netsec101.com
date: 2026-11-15
tags:
    - attack.execution
    - attack.t1059.006
    - attack.command-and-control
    - attack.t1071.001
    - attack.persistence
    - attack.t1543
    - cve.2026-123158
    - detection.emerging-threats
logsource:
    product: linux
    category: process_creation
detection:
    selection:
        CommandLine|contains:
            - 'tac_agent.py'
            - 'tac.vpnla.org'
            - 'tac-agent.init'
            - '/etc/init.d/tac-agent'
            - 'rc-service tac-agent'
            - 'rc-update add tac-agent'
    condition: selection
falsepositives:
    - Threat intel or IR staff grepping for these strings on a host (exclude your own analysis accounts)
level: high
