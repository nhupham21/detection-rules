title: Ghostscript or Web/Print Service Account Writing Scripts or Unexpected Files to Temp Directories
id: fce501fb-70ab-4899-b2a0-1634140ed9cd
status: experimental
description: |
    Hunts for Ghostscript writing files in /var/tmp or /dev/shm, or outside its own scratch files in /tmp, and for web or print
    service accounts dropping scripts or binaries into /tmp, /var/tmp or /dev/shm. The pwn.ai proof wrote a marker file under
    /var/tmp on the Debian print server; that exact name is included as a lab and PoC artefact, not an in-the-wild indicator.
references:
    - https://pwn.ai/upload2shell/research.html
    - https://www.cve.org/CVERecord?id=CVE-2026-125396
    - https://netsec101.com/?p=476
author: netsec101.com
date: 2026-11-23
tags:
    - attack.command-and-control
    - attack.t1105
    - cve.2026-125396
    - detection.threat-hunting
logsource:
    product: linux
    category: file_event
detection:
    selection_gs_image:
        Image|endswith:
            - '/gs'
            - '/gsc'
            - '/ghostscript'
    selection_gs_path:
        TargetFilename|startswith:
            - '/tmp/'
            - '/var/tmp/'
            - '/dev/shm/'
    filter_gs_scratch:
        # Assumed prefixes, verify on your hosts: gs scratch files gs_, ImageMagick temp files magick-
        TargetFilename|startswith:
            - '/tmp/gs_'
            - '/tmp/magick-'
    selection_svc_user:
        User:
            - 'www-data'
            - 'apache'
            - 'nginx'
            - 'http'
            - 'lp'
            - 'roundcube_sysuser'
    selection_svc_path:
        TargetFilename|startswith:
            - '/tmp/'
            - '/var/tmp/'
            - '/dev/shm/'
    selection_svc_ext:
        TargetFilename|endswith:
            - '.sh'
            - '.py'
            - '.pl'
            - '.php'
            - '.elf'
            - '.so'
            - '.bin'
    selection_poc_marker:
        TargetFilename: '/var/tmp/GS_CUPS_PIPE_RCE'
    condition: (selection_gs_image and selection_gs_path and not filter_gs_scratch) or (selection_svc_user and selection_svc_path and selection_svc_ext) or selection_poc_marker
falsepositives:
    - Applications that point Ghostscript's TMPDIR or -sOutputFile into /var/tmp or /dev/shm; add that prefix to the filter
    - PHP applications that cache compiled templates or plugin files as .php under /tmp
    - Package or plugin installers running as www-data
level: low
