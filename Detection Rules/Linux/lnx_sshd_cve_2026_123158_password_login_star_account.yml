title: Potential CVE-2026-123158 Exploitation - SSH Password Login To Root Or Alpine Account
id: 2e635140-37d2-48cd-913d-ee473f0b36f9
status: test
description: |
    Detects a successful sshd password login for the "root" or "alpine" account. On Alpine Linux both ship with "*"
    in /etc/shadow and have no password, so on a musl-based sshd without PAM a password login to them is the main
    sign of sshole (CVE-2026-123158) exploitation. Scope this rule to Alpine and other musl hosts.
references:
    - https://alpinelinux.org/posts/2026-11-05-openssh-password-authentication-bypass/
    - https://wakefield.co/research/openssh-musl-authentication-bypass
    - https://nvd.nist.gov/vuln/detail/CVE-2026-123158
    - https://netsec101.com/?p=242
author: netsec101.com
date: 2026-11-15
tags:
    - attack.initial-access
    - attack.t1190
    - attack.t1078.003
    - cve.2026-123158
    - detection.emerging-threats
logsource:
    product: linux
    service: sshd
detection:
    keywords:
        - 'Accepted password for root from'
        - 'Accepted password for alpine from'
    condition: keywords
falsepositives:
    - Hosts where an admin set a real root password and enabled PermitRootLogin yes (common on glibc distributions, rare on Alpine)
    - Alpine hosts where the alpine user was deliberately given a password
level: high
