title: Nginx Process Spawning a Child Process - Potential Worker Compromise
id: abbc6c67-d2df-4432-9df2-5d8104ea2480
status: experimental
description: |
    Detects a process started with an nginx (or OpenResty) process as its parent, other than nginx itself.
    Workers serve requests in-process and should not start programs, so a shell or tool under nginx is a strong
    sign of post-exploitation, for example after memory corruption such as CVE-2026-123007 in HTTP/2.
references:
    - https://www.wiz.io/blog/nginx-http2-rce-vulnerabilities
    - https://xint.io/blog/nginx2root-remote-code-execution
    - https://www.rapid7.com/blog/post/ve-cve-2026-123007-critical-nginx-http-2-integer-underflow-leads-to-rce-fixed/
    - https://github.com/SigmaHQ/sigma/blob/master/rules/linux/process_creation/proc_creation_lnx_webshell_detection.yml
author: netsec101.com
date: 2026-11-19
tags:
    - attack.initial-access
    - attack.t1190
    - attack.execution
    - attack.t1059.004
    - cve.2026-123007
logsource:
    product: linux
    category: process_creation
detection:
    selection:
        ParentImage|endswith:
            - '/nginx'
            - '/openresty'
    filter_main_nginx_self:
        # binary upgrade (USR2) makes the master exec a new nginx binary
        Image|endswith:
            - '/nginx'
            - '/openresty'
    filter_optional_passenger:
        # Phusion Passenger's agent is started by the nginx master by design
        Image|contains: '/passenger'
    condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
falsepositives:
    - OpenResty Lua code that calls os.execute or io.popen on purpose
    - Application servers integrated into nginx that start helper processes (Passenger and similar)
    - Admins running nginx -t or nginx -s from a shell are not matched, because the parent there is the shell
level: high
