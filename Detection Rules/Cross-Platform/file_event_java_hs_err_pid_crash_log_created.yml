title: JVM Fatal Error Log hs_err_pid Created
id: 6d8a889e-1a29-4c85-997f-2504dec3eed4
name: jvm_hs_err_pid_crash_log_created
status: test
description: |
    Detects creation of a HotSpot fatal error log (hs_err_pid<pid>.log), which the JVM writes when it crashes.
    Failed CVE-2026-114938 (Java4Shell) heap grooming and bursts of trigger input crash the JVM, so a new crash
    log on an internet-facing Java service running on AVX-512 hardware deserves a look.
references:
    - https://calif.io/java4shell/
    - https://www.vulncheck.com/blog/java4shell
    - https://www.herodevs.com/blog-posts/java4shell-cve-2026-114938-spring-boot-tomcat-jetty
    - https://docs.oracle.com/en/java/javase/21/troubleshoot/fatal-error-log.html
    - https://netsec101.com/?p=326
author: netsec101.com
date: 2026-11-18
tags:
    - attack.impact
    - attack.initial-access
    - attack.t1499.004
    - attack.t1190
    - cve.2026-114938
logsource:
    category: file_event
    definition: 'Requirement: file creation telemetry (Sysmon EID 11 on Windows, Sysmon for Linux EID 11 or an EDR on Linux). Sysmon for Linux file events need an explicit config. Containers: the EDR must see inside the container file system, and the file is lost when the pod restarts.'
detection:
    selection:
        TargetFilename|re: '[\\/]hs_err_pid[0-9]+\.log$'
    condition: selection
falsepositives:
    - Ordinary JVM crashes from native code, out-of-memory in native allocations or JDK bugs
    - Developers and CI jobs crashing JVMs on build agents (scope to production service hosts)
    - Custom -XX:ErrorFile names are not matched; add them if you set one
level: medium
