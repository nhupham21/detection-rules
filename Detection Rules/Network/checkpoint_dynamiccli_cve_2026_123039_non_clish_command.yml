title: Check Point Gaia DynamicCLI Command Without Clish Wrapper - CVE-2026-123039
id: 1661f7ea-6cb2-4c65-bc8a-3d61ad47bc34
status: test
description: |
    Detects commands received by the root dynamic_server daemon on Check Point Gaia that do not carry
    the fixed Clish wrapper, or that use the system() return-value sink. Check Point sk1000362 names both
    patterns in /var/log/dynamicCli.log as signs that a local process other than Clish talked to the
    world-writable /tmp/dynamic_socket (CVE-2026-123039).
references:
    - https://support.checkpoint.com/results/sk/sk1000362
    - https://research.checkpoint.com/2026/php2shell-exploitation-on-check-point-gateway/
    - https://netsec101.com/?p=244
author: netsec101.com
date: 2026-11-15
tags:
    - attack.privilege-escalation
    - attack.t1068
    - cve.2026-123039
    - detection.emerging-threats
logsource:
    product: checkpoint
    service: dynamiccli
    definition: 'Requirement: forward /var/log/dynamicCli.log from every Gaia gateway, cluster member and management server to the SIEM (not shipped by default).'
detection:
    keywords_received:
        - 'Received ='
    filter_main_clish_wrapper:
        - 'CPprofile.sh >> /dev/null; export SP_DISTRIBUTE=0; set -o noglob;'
    keywords_system_sink:
        - 'Received = #return_value#'
    condition: (keywords_received and not filter_main_clish_wrapper) or keywords_system_sink
falsepositives:
    - Check Point internal tooling or support scripts that call Dynamic CLI without the Clish wrapper; baseline one known-good gateway per version before alerting
level: medium
