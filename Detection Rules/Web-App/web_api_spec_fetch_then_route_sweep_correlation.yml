title: API Specification Fetch Followed by a Route Sweep From the Same Client
id: 3ac6dd7a-0751-45db-be40-32bc3a17e16e
status: experimental
description: |
    Detects a client that downloads an OpenAPI specification or source map and then, within five minutes,
    requests at least ten distinct API routes. Unit 42 reports ARTEX agents hitting routes from downloaded
    specs almost immediately. The window and the threshold are inferred, not published values.
references:
    - https://unit42.paloaltonetworks.com/artex-and-ai-powered-red-teaming-tools/
    - https://www.ic3.gov/CSA/2026/261113.pdf
    - https://netsec101.com/?p=440
author: netsec101.com
date: 2026-11-22
tags:
    - attack.initial-access
    - attack.t1190
    - attack.reconnaissance
    - attack.t1594
correlation:
    type: temporal_ordered
    rules:
        - web_api_spec_fetch
        - web_api_route_sweep
    group-by:
        - c-ip
    timespan: 5m
falsepositives:
    - API testing tools (Postman, Insomnia) importing your spec and running a collection; exclude internal and partner integration ranges
    - Your own DAST scanner
level: medium
