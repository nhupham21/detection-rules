title: Many Distinct API Routes Requested by One Client
id: d73010fb-2c25-4822-aa86-e98c299142d3
name: web_api_route_sweep
status: experimental
description: |
    Correlation step 1 of 2. Counts distinct API paths requested by one client IP in five minutes.
    Feeds the spec-driven targeting sequence below; not meant to alert on its own.
references:
    - https://unit42.paloaltonetworks.com/artex-and-ai-powered-red-teaming-tools/
    - https://netsec101.com/?p=440
author: netsec101.com
date: 2026-11-22
tags:
    - attack.initial-access
    - attack.t1190
correlation:
    type: value_count
    rules:
        - web_api_route_request
    group-by:
        - c-ip
    timespan: 5m
    condition:
        field: cs-uri-stem
        gte: 10
falsepositives:
    - Single-page applications that call many API routes on load; raise the threshold above your busiest real client
level: informational
