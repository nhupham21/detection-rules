title: Azure Key Vault - Twenty or More Secret Reads by One Identity
id: 595bfe6d-260b-4793-a96d-fbeedb9e78cf
name: azure_kv_secret_read_volume
status: test
description: |
    Correlation step 1 of 3. One identity reads 20 or more Key Vault secrets in 15 minutes.
references:
    - https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/
    - https://netsec101.com/?p=440
author: netsec101.com
date: 2026-11-22
tags:
    - attack.credential-access
    - attack.t1555.006
correlation:
    type: event_count
    rules:
        - azure_keyvault_secret_get
    group-by:
        - identity_claim_oid_g
    timespan: 15m
    condition:
        gte: 20
falsepositives:
    - Applications that load their whole configuration at start-up
level: informational
---
title: Azure Key Vault - Secrets Read From Three or More Vaults by One Identity
id: e42e16ce-6094-46d0-a78d-5ce7eecb47ff
name: azure_kv_secret_read_spread
status: test
description: |
    Correlation step 2 of 3. One identity reads secrets from at least three distinct vaults in 15 minutes.
references:
    - https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/
    - https://netsec101.com/?p=440
author: netsec101.com
date: 2026-11-22
tags:
    - attack.credential-access
    - attack.t1555.006
correlation:
    type: value_count
    rules:
        - azure_keyvault_secret_get
    group-by:
        - identity_claim_oid_g
    timespan: 15m
    condition:
        field: Resource
        gte: 3
falsepositives:
    - Backup and secret-rotation services that touch every vault
level: informational
---
title: Azure Key Vault Secret Read Burst Across Multiple Vaults by One Identity
id: b4558cd4-6c25-4d8f-bea6-1a6ea78c461c
status: test
description: |
    Detects one identity reading at least 20 secrets across at least three Key Vaults within 15 minutes, the
    hunting threshold Microsoft Threat Intelligence published for the Storm-0940 ARTEX campaign. An agent with
    a fresh token enumerates every vault it can reach; most applications read a few secrets from one vault.
references:
    - https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/
    - https://www.ic3.gov/CSA/2026/261113.pdf
    - https://netsec101.com/?p=440
author: netsec101.com
date: 2026-11-22
tags:
    - attack.credential-access
    - attack.t1555.006
correlation:
    type: temporal
    rules:
        - azure_kv_secret_read_volume
        - azure_kv_secret_read_spread
    group-by:
        - identity_claim_oid_g
    timespan: 15m
falsepositives:
    - Secret-rotation, backup and security-posture tools; exclude their object IDs after confirming them
    - Administrators running bulk scripts during a migration
level: medium
