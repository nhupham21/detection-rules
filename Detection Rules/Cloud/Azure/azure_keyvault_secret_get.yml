title: Azure Key Vault Secret Read
id: e6881822-164a-4638-8c97-f21050921796
name: azure_keyvault_secret_get
status: test
description: |
    Base rule for the Key Vault read-burst correlation. Matches SecretGet operations in Key Vault resource
    diagnostic logs (category AuditEvent). These are data-plane logs, not Activity log entries, and must be
    enabled per vault through diagnostic settings.
references:
    - https://www.microsoft.com/en-us/security/blog/2026/10/21/storm-0940-uses-artex-agentic-ai-connectwise-supply-chain-compromise/
    - https://netsec101.com/?p=440
author: netsec101.com
date: 2026-11-22
tags:
    - attack.credential-access
    - attack.t1555.006
logsource:
    product: azure
    service: keyvault
detection:
    selection:
        OperationName: 'SecretGet'
    condition: selection
falsepositives:
    - All normal application secret reads; this rule only feeds the correlation
level: informational
