title: Azure App Service Basic Auth Publishing Policy Changed
id: 3c3f0ea3-b47b-47c1-96f1-59e7ea4f1ee3
status: experimental
description: |
    Detects a write to the FTP or SCM basic authentication publishing policy of an App Service app or slot, unless the
    logged request body shows it being disabled. Re-enabling basic auth brings back long-lived deploy passwords. Hardening
    rule, not an exploit signature for CVE-2026-58630; the request body logic is inferred and depends on your export.
references:
    - https://learn.microsoft.com/en-us/azure/app-service/configure-basic-auth-disable
    - https://learn.microsoft.com/en-us/azure/role-based-access-control/permissions/web-and-mobile
    - https://netsec101.com/?p=502
author: netsec101.com
date: 2026-11-25
tags:
    - attack.persistence
    - attack.t1556
logsource:
    product: azure
    service: activitylogs
detection:
    selection:
        operationName:
            - 'MICROSOFT.WEB/SITES/BASICPUBLISHINGCREDENTIALSPOLICIES/WRITE'
            - 'MICROSOFT.WEB/SITES/SLOTS/BASICPUBLISHINGCREDENTIALSPOLICIES/WRITE'
    filter_main_disable:
        properties.requestbody|contains:
            - '"allow":false'
            - '"allow": false'
    condition: selection and not filter_main_disable
falsepositives:
    - Planned exceptions where a team needs FTP or Web Deploy basic auth for a legacy tool
    - Policy writes without a logged request body fire as well; check the resulting setting before escalating
    - ARM or Bicep deployments that re-apply the policy resource on every run
level: medium
