title: AWS Secrets Manager Secret Read With Long-Lived IAM User Access Key
id: 9ec9233a-89c5-4a33-a9cf-ba8c826adfbe
status: experimental
description: |
    Detects GetSecretValue or BatchGetSecretValue calls signed with a long-lived IAM user access key
    (key ID prefix AKIA) instead of temporary role credentials. In the Barracuda intrusion of November
    2026 an unretired third-party key was used to read stored secrets, including AWS keys and Azure
    service principal secrets, within minutes of first use.
references:
    - https://blog.barracuda.com/2026/11/11/anatomy-of-a-machine-speed-intrusion
    - https://www.ic3.gov/CSA/2026/261113.pdf
    - https://www.elastic.co/guide/en/security/current/rapid-secret-retrieval-attempts-from-aws-secretsmanager.html
    - https://netsec101.com/2026/11/22/barracuda-cloud-breach-artex-machine-speed-intrusion-sigma-detection-rules/
author: netsec101.com
date: 2026-11-17
tags:
    - attack.credential-access
    - attack.t1555.006
    - attack.t1078
logsource:
    product: aws
    service: cloudtrail
detection:
    selection_event:
        eventSource: 'secretsmanager.amazonaws.com'
        eventName:
            - 'GetSecretValue'
            - 'BatchGetSecretValue'
    selection_key:
        userIdentity.accessKeyId|startswith: 'AKIA'
    condition: all of selection_*
falsepositives:
    - Legacy applications or on-premises jobs that still authenticate with IAM user keys; baseline and exclude them by userIdentity.arn, then plan their move to roles
    - Break-glass administrators reading secrets from a workstation
level: medium
