title: AWS S3 Object Written and Deleted by the Same Identity Within One Minute
id: 24d3f38e-bfe4-425d-b437-476b196b6cf0
status: experimental
description: |
    Detects one identity writing and deleting the same S3 object key within a minute, the write-then-delete
    storage test Unit 42 lists as an ARTEX hallmark and the FBI describes as test writes and deletes. The
    one-minute window is inferred. Real workloads rarely delete the exact object they just created.
references:
    - https://unit42.paloaltonetworks.com/artex-and-ai-powered-red-teaming-tools/
    - https://www.ic3.gov/CSA/2026/261113.pdf
    - https://netsec101.com/?p=440
author: netsec101.com
date: 2026-11-22
tags:
    - attack.discovery
    - attack.t1580
    - attack.initial-access
    - attack.t1078.004
correlation:
    type: value_count
    rules:
        - aws_s3_object_put_or_delete
    group-by:
        - userIdentity.arn
        - requestParameters.bucketName
        - requestParameters.key
    timespan: 1m
    condition:
        field: eventName
        gte: 2
falsepositives:
    - Temporary-file and lock-file patterns (Terraform state locks, ETL scratch objects); exclude those buckets or key prefixes
    - Health checks that write and delete a canary object; exclude their role ARN
level: medium
